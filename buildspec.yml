version: 0.2

env:
  parameter-store:
    API_URL: /myapp/development/api-url

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "=== Installing dependencies ==="
      - npm ci

  pre_build:
    commands:
      - echo "=== Running security audit ==="
      - npm audit --json > security-report.json || true
      - npm audit --audit-level=high
      - echo "=== Security audit passed ==="
      - echo "=== Running tests ==="
      - npm test -- --runInBand

  build:
    commands:
      - echo "=== Building application ==="
      - 'echo "Building against API: $API_URL"'
      - npm run build

  post_build:
    commands:
      - echo "=== Running smoke tests ==="
      - npm run smoke
      - echo "Build completed on `date`"

artifacts:
  files:
    - '**/*'
    - security-report.json
  exclude-paths:
    - node_modules/**/*
    - .git/**/*

cache:
  paths:
    - 'node_modules/**/*'
    
reports:
  MyAppTestReport:
    files:
      - 'test-results/junit.xml'
    file-format: JUNITXML