version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "=== Installing dependencies ==="
      - npm ci

  pre_build:
    commands:
      - echo "=== Running linter ==="
      - npm run lint

  build:
    commands:
      - this-command-does-not-exist
      - npm run build

  post_build:
    commands:
      - echo "=== Running smoke tests ==="
      - npm run smoke
      - echo "Build completed on `date`"

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - node_modules/**/*
    - .git/**/*
    - coverage/**/*
    - .env
    - .env.*

cache:
  paths:
    - 'node_modules/**/*'